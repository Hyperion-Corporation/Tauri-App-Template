[package]
name = "tauri-app-template-backend-bridge"
version = "0.1.0"
description = "Tauri application bridge for Tauri-App-Template"
authors = ["ACFHarbinger"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "tauri_app_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tauri-app-template"
path = "src/main.rs"
