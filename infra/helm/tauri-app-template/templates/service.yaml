apiVersion: v1
kind: Service
metadata:
  name: {{ include "tauri-app-template.name" . }}
  labels:
    {{- include "tauri-app-template.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tauri-app-template.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
