[project]
name = "tauri-app-template"
version = "0.1.0"
description = "Root workspace manifest for Tauri-App-Template. The Python middleware lives in middleware/."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "ACFHarbinger" }]
dependencies = []

[tool.uv.workspace]
members = ["middleware"]

[tool.uv]
# Root has no code of its own — just a workspace pointer to middleware/.
package = false
